seed: 42

audio:
  sr: 22050
  clip_seconds: 30
  window_seconds: 3
  n_windows: 10

mel:
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  ref: 1.0

mfcc:
  n_mfcc: 20

# usable clips per part; published split C is 443/197/290, minus jazz.00054
# (in C train, unreadable). All splits A/B/B'/C use these sizes.
split_sizes:
  train: 442
  valid: 197
  test: 290

split_seeds: [0, 1, 2, 3, 4]

bootstrap:
  n: 2000
  ci: 95

paths:
  raw: data/raw
  audio_dir: data/raw/Data/genres_original
  splits: splits
  features: features
  models: models
  results: results
  site_data: docs/data
  site_img: docs/img

genres: [blues, classical, country, disco, hiphop, jazz, metal, pop, reggae, rock]

# hyperparameter grids, tuned on the valid part by clip macro-F1 (src/train_classical.py)
grids:
  knn:
    n_neighbors: [1, 3, 5, 9, 15, 25]
    weights: [uniform, distance]
  logreg:
    C: [0.01, 0.1, 1, 10]
  svm:
    C: [0.1, 1, 10, 100]
    gamma: [scale, 0.001, 0.01, 0.1]   # plain decimals: YAML reads 1e-3 as a string
  xgb:
    max_depth: [3, 5, 7]
    learning_rate: [0.05, 0.1]
logreg_max_iter: 2000

# fixed XGBoost settings; trees are capped at n_estimators and early-stopped on valid mlogloss
xgb:
  n_estimators: 2000
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  eval_metric: mlogloss

# log-mel CNN (src/cnn.py, src/train_cnn.py). Training seed = seed + run seed.
cnn:
  crop_frames: 130          # 3 s at hop 512 (66,150 / 512 = 129.2 frames)
  crops_per_clip: 10        # random crops per training clip per epoch
  channels: [32, 64, 128, 128]
  dropout: 0.3
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  epochs: 60
  patience: 8               # epochs without a better valid clip macro-F1
  seeds: [0, 1, 2]
  augment:
    freq_masks: 2
    freq_width: 15          # max mel bins per mask
    time_masks: 2
    time_width: 20          # max frames per mask
    gain_db: 6              # uniform in [-6, +6] dB, added before normalisation

# validation analyses (scripts/analysis_val.py), split C train/valid only
analysis:
  window_seconds: [1, 3, 5, 10]           # must divide clip_seconds
  artist_fractions: [0.25, 0.5, 0.75, 1.0]
  repeats: 3                              # random artist subsets per fraction (seeds seed+0..2)
  calibration_bins: 10
  permutation_repeats: 10                 # permutation importance on valid (scripts/analysis_errors.py)
  feature_groups:                         # feature-name stems (mfcc1..20 -> mfcc); every feature in one group
    mfcc: [mfcc]
    chroma: [chroma]
    spectral_shape: [centroid, bandwidth, rolloff]
    zcr_rms: [zcr, rms]
    hpss: [harm_rms, perc_rms]
    tempo: [tempo]
